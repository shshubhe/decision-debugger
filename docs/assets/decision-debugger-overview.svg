<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" style="max-width:100%;height:auto" role="img" aria-labelledby="title description">
  <title id="title">One line. Four wrong turns.</title>
  <desc id="description">Recorded manual-chat subagent experiment with requested model GPT-6.1 Sol. Baseline: 24 of 24 correct. Revised: 20 of 24 correct. Easy and adversarial cases remain eight of eight; complex cases fall from eight to four of eight. The only added classifier instruction prioritizes TECHNICAL when payment and a crash or error are both mentioned. Zero improvements, four billing regressions, twenty unchanged. These are observed batch results, not an instrumented API benchmark or proof of internal model reasoning.</desc>
  <rect x="1" y="1" width="1098" height="658" rx="16" fill="#F4F7FC" stroke="#D8E2EF"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="40" y="65" font-size="45" font-weight="700" fill="#14253F">One line. Four wrong turns.</text>
    <text x="40" y="103" font-size="19" fill="#52627A">Recorded support-routing experiment | requested model: GPT-6.1 Sol</text>
    <path d="M40 128H1060" stroke="#D8E2EF"/>

    <g id="baseline-result">
      <text x="40" y="170" font-size="21" font-weight="600" fill="#14253F">Before: baseline prompt</text>
      <text x="36" y="252" font-size="82" font-weight="700" fill="#315A89">24/24</text>
      <text x="40" y="284" font-size="19" fill="#52627A">100% correctly routed</text>
      <rect x="40" y="302" width="480" height="14" rx="7" fill="#315A89"/>
    </g>

    <g id="revised-result">
      <text x="580" y="170" font-size="21" font-weight="600" fill="#14253F">After: one added instruction</text>
      <text x="576" y="252" font-size="82" font-weight="700" fill="#B33727">20/24</text>
      <text x="580" y="284" font-size="19" fill="#805247">83.3% correctly routed | 4 new errors</text>
      <rect x="580" y="302" width="480" height="14" rx="7" fill="#B33727"/>
      <path d="M587 302H980V316H587a7 7 0 0 1 0-14Z" fill="#315A89"/>
    </g>

    <g id="category-comparison" font-size="20" fill="#33465F">
      <text x="40" y="361" font-size="16" fill="#52627A">CASE TYPE</text>
      <text x="660" y="361" text-anchor="middle" font-size="16" fill="#52627A">BASELINE</text>
      <text x="950" y="361" text-anchor="middle" font-size="16" fill="#52627A">REVISED</text>
      <path d="M40 375H1060" stroke="#D8E2EF"/>
      <text x="40" y="404">Easy routing</text>
      <text x="660" y="404" text-anchor="middle">8/8</text>
      <text x="950" y="404" text-anchor="middle">8/8</text>
      <rect x="28" y="417" width="1044" height="40" fill="#FFF2EE"/>
      <text x="40" y="445" font-weight="600" fill="#6F2B24">Complex / mixed intent</text>
      <text x="660" y="445" text-anchor="middle" fill="#6F2B24">8/8</text>
      <text x="950" y="445" text-anchor="middle" font-weight="700" fill="#B33727">4/8</text>
      <text x="40" y="487">Adversarial instructions</text>
      <text x="660" y="487" text-anchor="middle">8/8</text>
      <text x="950" y="487" text-anchor="middle">8/8</text>
    </g>

    <text x="40" y="529" font-size="17" fill="#52627A">The only changed classifier instruction:</text>
    <rect x="40" y="543" width="1020" height="49" rx="12" fill="#FFF2EE" stroke="#F0CDBF"/>
    <text x="56" y="574" font-family="Consolas, Courier New, monospace" font-size="18" fill="#6F2B24">+ If a ticket mentions both payment and a crash or error, choose TECHNICAL.</text>

    <text x="40" y="625" font-size="19" font-weight="600" fill="#14253F">0 fixes. 4 regressions. 20 unchanged. Hold this revision.</text>
    <text x="40" y="648" font-size="14" fill="#52627A">manual_chat batches, not an API benchmark. Causality and broader reliability are not established.</text>
  </g>
</svg>
